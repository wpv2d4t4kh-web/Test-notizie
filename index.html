<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>TG22 - Notizie</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: transparent;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding-bottom: 28px; 
  }

  .bbc-header {
    display: flex;
    align-items: center;
    margin-left: 24px;
    margin-bottom: 4px;
  }

  .bbc-badge {
    background-color: #BB1919;
    color: #FFFFFF;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 1.5px;
    padding: 4px 10px;
    text-transform: uppercase;
    box-shadow: 2px 2px 4px rgba(0,0,0,0.6);
  }

  .ticker-wrapper {
    display: flex;
    align-items: stretch;
    width: 100%;
    height: 44px;
    background-color: rgba(255, 255, 255, 0.96);
    border-top: 3px solid #BB1919;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.5);
  }

  .clock-box {
    background-color: #BB1919;
    color: #FFFFFF;
    font-weight: 800;
    font-size: 21px;
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    letter-spacing: 1px;
    z-index: 2;
    flex-shrink: 0;
  }

  .marquee-container {
    flex-grow: 1;
    overflow: hidden;
    display: flex;
    align-items: center;
    position: relative;
  }

  .marquee-text {
    display: inline-block;
    white-space: nowrap;
    color: #121212;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.5px;
    padding-left: 100%;
    animation: scroll-bbc 65s linear infinite;
  }

  .separator {
    color: #BB1919;
    margin: 0 18px;
    font-weight: 900;
  }

  @keyframes scroll-bbc {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-100%); }
  }
</style>
</head>
<body>

  <div class="bbc-header">
    <div class="bbc-badge">TG22 • ULTIM'ORA</div>
  </div>

  <div class="ticker-wrapper">
    <div class="clock-box" id="clock">00:00</div>
    <div class="marquee-container">
      <div class="marquee-text" id="news-ticker">
        TG22 IN DIRETTA SUL CANALE 22 UHF <span class="separator">■</span> AGGIORNAMENTO NOTIZIE IN CORSO...
      </div>
    </div>
  </div>

<script>
  // 1. Orologio in tempo reale
  function updateClock() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('clock').textContent = hours + ':' + minutes;
  }
  updateClock();
  setInterval(updateClock, 1000);

  // 2. Scarica e legge direttamente l'XML del feed RSS
  async function fetchRSS(feedUrl) {
    // Usa AllOrigins come ponte CORS diretto per leggere l'XML originale
    const proxyUrl = `https://allorigins.win{encodeURIComponent(feedUrl)}`;
    const response = await fetch(proxyUrl);
    if (!response.ok) throw new Error('Errore proxy');
    
    const data = await response.json();
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(data.contents, "text/xml");
    
    const items = Array.from(xmlDoc.querySelectorAll("item"));
    return items.slice(0, 6).map(item => {
      const titleEl = item.querySelector("title");
      return titleEl ? titleEl.textContent.trim().toUpperCase() : "";
    }).filter(t => t.length > 0);
  }

  async function loadNews() {
    const tickerEl = document.getElementById('news-ticker');
    const feeds = [
      'https://www.ansa.it/sito/ansait_rss.xml',
      'https://www.ansa.it/sito/ansait_rss.xml'
    ];

    try {
      let allHeadlines = [];
      for (const feed of feeds) {
        try {
          const titles = await fetchRSS(feed);
          allHeadlines = allHeadlines.concat(titles);
        } catch (e) {
          console.warn('Feed saltato:', feed);
        }
      }

      if (allHeadlines.length > 0) {
        const uniqueHeadlines = [...new Set(allHeadlines)];
        tickerEl.innerHTML = uniqueHeadlines.join(' <span class="separator">■</span> ') + ' <span class="separator">■</span> ';
      } else {
        // Fallback se entrambi i proxy sono momentaneamente occupati
        tickerEl.innerHTML = 'TG22 IN DIRETTA SUL CANALE 22 UHF <span class="separator">■</span> NOTIZIE ITALIA E MONDO <span class="separator">■</span> SPECIALE NATALE IN ONDA DA CROTONE <span class="separator">■</span>';
      }
    } catch (error) {
      console.error('Errore generale:', error);
    }
  }

  loadNews();
  setInterval(loadNews, 600000); // Aggiorna ogni 10 minuti
</script>

</body>
</html>
