<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>TG22</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: transparent;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding-bottom: 28px; 
  }

  .bbc-header {
    display: flex;
    align-items: center;
    margin-left: 24px;
    margin-bottom: 4px;
  }

  .bbc-badge {
    background-color: #BB1919;
    color: #FFFFFF;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 1.5px;
    padding: 4px 10px;
    text-transform: uppercase;
    box-shadow: 2px 2px 4px rgba(0,0,0,0.6);
  }

  .ticker-wrapper {
    display: flex;
    align-items: stretch;
    width: 100%;
    height: 44px;
    background-color: rgba(255, 255, 255, 0.96);
    border-top: 3px solid #BB1919;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.5);
  }

  .clock-box {
    background-color: #BB1919;
    color: #FFFFFF;
    font-weight: 800;
    font-size: 21px;
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    letter-spacing: 1px;
    z-index: 2;
    flex-shrink: 0;
  }

  .marquee-container {
    flex-grow: 1;
    overflow: hidden;
    display: flex;
    align-items: center;
    position: relative;
  }

  .marquee-text {
    display: inline-block;
    white-space: nowrap;
    color: #121212;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.5px;
    padding-left: 100%;
    /* Velocità: aumenta i secondi se ci sono tante notizie */
    animation: scroll-bbc 65s linear infinite;
  }

  .separator {
    color: #BB1919;
    margin: 0 18px;
    font-weight: 900;
  }

  @keyframes scroll-bbc {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-100%); }
  }
</style>
</head>
<body>

  <div class="bbc-header">
    <div class="bbc-badge">TG22 • ULTIM'ORA</div>
  </div>

  <div class="ticker-wrapper">
    <div class="clock-box" id="clock">00:00</div>
    <div class="marquee-container">
      <div class="marquee-text" id="news-ticker">
        CARICAMENTO NOTIZIE TG22 IN CORSO...
      </div>
    </div>
  </div>

<script>
  // 1. Orologio in tempo reale
  function updateClock() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('clock').textContent = hours + ':' + minutes;
  }
  updateClock();
  setInterval(updateClock, 1000);

  // 2. Recupero automatico notizie da Feed RSS (es. ANSA)
  async function loadNews() {
    // Puoi sostituire l'URL dopo "rss_url=" con qualsiasi altro feed RSS
    const rssUrl = encodeURIComponent('https://ansa.it');
    const apiUrl = `https://rss2json.com{rssUrl}`;

    try {
      const response = await fetch(apiUrl);
      const data = await response.json();

      if (data.status === 'ok' && data.items.length > 0) {
        // Prende i primi 8 titoli e li mette in maiuscolo
        const headlines = data.items.slice(0, 8).map(item => item.title.toUpperCase());
        const htmlContent = headlines.join(' <span class="separator">■</span> ') + ' <span class="separator">■</span> ';
        
        const tickerEl = document.getElementById('news-ticker');
        tickerEl.innerHTML = htmlContent;
      }
    } catch (error) {
      console.error('Errore caricamento notizie:', error);
    }
  }

  // Carica subito le notizie e le aggiorna ogni 10 minuti (600.000 ms)
  loadNews();
  setInterval(loadNews, 600000);
</script>

</body>
</html>
