<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: transparent;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    /* Margine di sicurezza in basso per evitare il taglio (overscan) del CRT */
    padding-bottom: 28px; 
  }

  /* Barra superiore opzionale con etichetta stile BBC */
  .bbc-header {
    display: flex;
    align-items: center;
    margin-left: 24px;
    margin-bottom: 4px;
  }

  .bbc-badge {
    background-color: #BB1919;
    color: #FFFFFF;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 1.5px;
    padding: 4px 10px;
    text-transform: uppercase;
    box-shadow: 2px 2px 4px rgba(0,0,0,0.6);
  }

  /* Barra principale del ticker */
  .ticker-wrapper {
    display: flex;
    align-items: stretch;
    width: 100%;
    height: 44px;
    background-color: rgba(255, 255, 255, 0.96);
    border-top: 3px solid #BB1919;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.5);
  }

  /* Riquadro orologio in stile BBC a sinistra */
  .clock-box {
    background-color: #BB1919;
    color: #FFFFFF;
    font-weight: 800;
    font-size: 21px;
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    letter-spacing: 1px;
    z-index: 2;
    flex-shrink: 0;
  }

  /* Contenitore testo scorrevole */
  .marquee-container {
    flex-grow: 1;
    overflow: hidden;
    display: flex;
    align-items: center;
    position: relative;
  }

  .marquee-text {
    display: inline-block;
    white-space: nowrap;
    color: #121212;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.5px;
    padding-left: 100%;
    /* Regola '28s' per cambiare la velocità di scorrimento */
    animation: scroll-bbc 28s linear infinite;
  }

  .separator {
    color: #BB1919;
    margin: 0 18px;
    font-weight: 900;
  }

  @keyframes scroll-bbc {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-100%); }
  }
</style>
</head>
<body>

  <div class="bbc-header">
    <div class="bbc-badge">NEWS • EUROPE</div>
  </div>

  <div class="ticker-wrapper">
    <div class="clock-box" id="clock">00:00</div>
    <div class="marquee-container">
      <div class="marquee-text">
        BENVENUTI SU TEST
        <span class="separator">■</span>
        TEST
        <span class="separator">■</span>
        TEST
        <span class="separator">■</span>
      </div>
    </div>
  </div>

<script>
  function updateClock() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('clock').textContent = hours + ':' + minutes;
  }
  updateClock();
  setInterval(updateClock, 1000);
</script>

</body>
</html>
